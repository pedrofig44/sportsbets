{% extends "includes/base.html" %}

{% block content %}
<main class="d-flex w-100">
    <div class="container d-flex flex-column">
        <div class="row vh-100">
            <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto d-table h-100">
                <div class="d-table-cell align-middle">

                    <div class="text-center mt-4">
                        <h1 class="h2">SportBets</h1>
                        <p class="lead">Crie a sua conta</p>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <div class="m-sm-3">
                                <!-- Display messages -->
                                {% if messages %}
                                    {% for message in messages %}
                                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                            {{ message }}
                                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                        </div>
                                    {% endfor %}
                                {% endif %}

                                <form method="post">
                                    {% csrf_token %}
                                    
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Primeiro Nome</label>
                                            <input class="form-control form-control-lg" type="text" name="first_name" placeholder="Primeiro nome" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Último Nome</label>
                                            <input class="form-control form-control-lg" type="text" name="last_name" placeholder="Último nome" required>
                                        </div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Username</label>
                                        <input class="form-control form-control-lg" type="text" name="username" placeholder="Escolha um username" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input class="form-control form-control-lg" type="email" name="email" placeholder="email@exemplo.com" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Password</label>
                                        <input class="form-control form-control-lg" type="password" name="password1" placeholder="Mínimo 8 caracteres" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label">Confirmar Password</label>
                                        <input class="form-control form-control-lg" type="password" name="password2" placeholder="Confirme a password" required>
                                    </div>
                                    
                                    <div class="d-grid gap-2 mt-3">
                                        <button type="submit" class="btn btn-lg btn-primary">
                                            <i data-feather="user-plus"></i>
                                            Criar Conta
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div class="text-center mb-3">
                        <p class="text-muted">
                            Já tem conta? 
                            <a href="{% url 'accounts:login' %}" class="text-decoration-none">
                                Entrar
                            </a>
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>
{% endblock content %}
